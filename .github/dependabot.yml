version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # TypeScript 7.x crashes typescript-eslint 8.x at lint time
      # (TypeError: reading 'Cjs'). Hold at 6.x until typescript-eslint
      # officially supports TS 7, then bump both together.
      # (Gespiegelt von status-page-to-chat, siehe dortiges lessons.md.)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Node-Hauptversion bewusst von Hand wechseln (nur LTS, engines in
      # package.json mitziehen). Ungerade Versionen sind nie LTS.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
