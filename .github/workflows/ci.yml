name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Lint, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # better-sqlite3 liefert prebuilt native modules je Node-Major. Der
      # pnpm-Store-Cache kann ein Binding aus einem früheren Lauf mit anderer
      # Node-Version tragen → NODE_MODULE_VERSION-Mismatch. Rebuild erzwingt
      # Kompilierung gegen das aktuelle node-Binary.
      - name: Rebuild native modules for current Node
        run: pnpm rebuild better-sqlite3

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  # Verhindert, dass das Dockerfile unbemerkt verrottet (Build-only, kein Push).
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t social-to-chat:ci .
